[package]
name = "gamecontroller"
version = "0.8.7"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/doom-fish/gamecontroller-rs"
repository = "https://github.com/doom-fish/gamecontroller-rs"
description = "Safe Rust bindings for Apple's GameController framework — discovery, device snapshots, live input, and DualSense helpers on macOS"
authors = ["Per Johansson <per@doom.fish>"]
keywords = ["gamepad", "controller", "input", "macos", "games"]
categories = ["api-bindings", "os::macos-apis", "game-development"]
rust-version = "1.76"
readme = "README.md"
build = "build.rs"
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "swift-bridge/Package.swift",
    "swift-bridge/Sources/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
    "CHANGELOG.md",
    "COVERAGE.md",
]

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[lib]
name = "gamecontroller"
crate-type = ["lib"]

[features]
default = []
async = ["dep:doom-fish-utils"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
doom-fish-utils = { path = "../doom-fish-utils", version = ">=0.1, <0.4", optional = true }

[dev-dependencies]
regex-lite = "0.1"
pollster = "0.3"

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[[example]]
name = "01_list_controllers"

[[example]]
name = "02_poll_state"

[[example]]
name = "03_smoke_surface"

[[example]]
name = "04_device_snapshots"

[[example]]
name = "05_input_surface"

[[example]]
name = "06_async_streams"
required-features = ["async"]

[profile.release]
debug = "full"
strip = "none"
